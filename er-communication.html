<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Book — CMS ER Communication</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- DOMPurify for sanitization -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #f8fafc;
      color: #334155;
    }

    /* Markdown Styles */
    .prose {
      max-width: none;
    }

    .prose h1,
    .prose h2,
    .prose h3,
    .prose h4 {
      color: #0f172a;
      font-weight: 700;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
    }

    .prose h1 {
      font-size: 2.5rem;
      margin-top: 0;
      padding-bottom: 1rem;
      border-bottom: 2px solid #e2e8f0;
    }

    .prose h2 {
      font-size: 1.875rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .prose h3 {
      font-size: 1.5rem;
    }

    .prose p {
      margin-bottom: 1.25rem;
      line-height: 1.75;
    }

    .prose ul,
    .prose ol {
      margin-bottom: 1.25rem;
      padding-left: 1.5rem;
    }

    .prose ul {
      list-style-type: disc;
    }

    .prose ol {
      list-style-type: decimal;
    }

    .prose li {
      margin-bottom: 0.5rem;
    }

    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      background: white;
      border-radius: 0.5rem;
      overflow: hidden;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    }

    .prose th,
    .prose td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    .prose th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #1e293b;
    }

    .prose tr:last-child td {
      border-bottom: none;
    }

    .prose a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .prose a:hover {
      text-decoration: underline;
    }

    .prose strong {
      font-weight: 700;
      color: #0f172a;
    }

    .prose code {
      background: #f1f5f9;
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      font-family: monospace;
      font-size: 0.875em;
      color: #e11d48;
    }

    .prose hr {
      margin: 2rem 0;
      border-color: #e2e8f0;
    }

    /* Blockquotes and Alerts */
    .prose blockquote {
      border-left: 4px solid #cbd5e1;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      background: #f8fafc;
      border-radius: 0 0.5rem 0.5rem 0;
      color: #475569;
      font-style: italic;
    }

    .prose blockquote p:last-child {
      margin-bottom: 0;
    }

    .alert-note {
      border-left-color: #3b82f6;
      background-color: #eff6ff;
      color: #1e3a8a;
      font-style: normal;
    }

    .alert-important {
      border-left-color: #8b5cf6;
      background-color: #f5f3ff;
      color: #4c1d95;
      font-style: normal;
    }

    .alert-warning {
      border-left-color: #f59e0b;
      background-color: #fffbeb;
      color: #92400e;
      font-style: normal;
    }

    .alert-caution {
      border-left-color: #ef4444;
      background-color: #fef2f2;
      color: #991b1b;
      font-style: normal;
    }

    /* Screenshot placeholders */
    .screenshot-placeholder {
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
      border-radius: 0.5rem;
      padding: 3rem 1rem;
      text-align: center;
      color: #64748b;
      font-weight: 500;
      margin: 1.5rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .screenshot-placeholder:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }

    .screenshot-placeholder svg {
      width: 2.5rem;
      height: 2.5rem;
      margin-bottom: 0.5rem;
      color: #94a3b8;
    }

    /* Layout */
    .app-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 320px;
      background: #0f172a;
      color: #cbd5e1;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      padding: 2rem 1.5rem;
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    .sidebar-brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toc-link {
      display: block;
      padding: 0.35rem 0;
      color: #94a3b8;
      transition: all 0.2s;
      font-size: 0.95rem;
      text-decoration: none;
    }

    .toc-link:hover,
    .toc-link.active {
      color: white;
    }

    .toc-h2 {
      font-weight: 600;
      color: #e2e8f0;
      margin-top: 0.75rem;
    }

    .toc-h3 {
      padding-left: 1rem;
      font-size: 0.875rem;
      border-left: 1px solid #334155;
      margin-left: 0.5rem;
    }

    .toc-h3:hover {
      border-left-color: #cbd5e1;
    }

    .main-content {
      flex: 1;
      padding: 3rem 4rem;
      max-width: 1100px;
      background: white;
      margin: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    /* Hide markdown TOC from original content since we have a sidebar */
    #daftar-isi,
    #daftar-isi+ul {
      display: none;
    }

    @media (max-width: 1024px) {
      .app-container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        padding: 1.5rem;
      }

      .main-content {
        padding: 2rem;
        margin: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        CMS Manual Book
      </div>
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">DAFTAR ISI</div>
      <nav id="toc"></nav>
      <div class="mt-8 pt-4 border-t border-slate-700 text-xs text-slate-500">
        &copy; {{ date('Y') }} ER Communication
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div id="content" class="prose">
        <div class="flex justify-center items-center h-64 text-slate-400">
          <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
            </circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          Memproses dokumen...
        </div>
      </div>
    </main>
  </div>

  <!-- Inject Markdown Content directly from PHP -->
  <script type="text/markdown" id="markdown-data">
{!! $markdown !!}
    </script>

  <script>
    // Custom renderer for marked to handle special elements
    const renderer = new marked.Renderer();

    // Handle blockquotes to check for GitHub style alerts
    const originalBlockquote = renderer.blockquote.bind(renderer);
    renderer.blockquote = function (quote) {
      let className = '';
      let rawText = quote.text;

      if (rawText.startsWith('<p>')) {
        const match = rawText.match(/<p>([\s\S]*?)<\/p>/);
        if (match) rawText = match[1];
      }

      if (rawText.includes('[!NOTE]')) {
        className = 'alert-note';
        quote.text = quote.text.replace('\\[!NOTE\\]', '<strong>💡 Catatan:</strong><br>');
      } else if (rawText.includes('[!IMPORTANT]')) {
        className = 'alert-important';
        quote.text = quote.text.replace('\\[!IMPORTANT\\]', '<strong>⭐ Penting:</strong><br>');
      } else if (rawText.includes('[!WARNING]')) {
        className = 'alert-warning';
        quote.text = quote.text.replace('\\[!WARNING\\]', '<strong>⚠️ Peringatan:</strong><br>');
      } else if (rawText.includes('[!CAUTION]')) {
        className = 'alert-caution';
        quote.text = quote.text.replace('\\[!CAUTION\\]', '<strong>🛑 Awas:</strong><br>');
      }

      if (className) {
        return `<blockquote class="${className}">${quote.text}</blockquote>`;
      }
      return originalBlockquote(quote);
    };

    // Handle images/placeholders
    renderer.paragraph = function (text) {
      if (text.text.includes('[Sisipkan Screenshot')) {
        const placeholderText = text.text.replace('[', '').replace(']', '').replace('Sisipkan Screenshot — ', '');
        return `
                <div class="screenshot-placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span>Slot Gambar: <strong>${placeholderText}</strong></span>
                </div>`;
      }

      // Clean up alert texts that might bleed into paragraphs
      let cleanText = text.text;
      cleanText = cleanText.replace(/\\[!NOTE\\]|<br>\n/g, '');
      cleanText = cleanText.replace(/\\[!IMPORTANT\\]|<br>\n/g, '');
      cleanText = cleanText.replace(/\\[!WARNING\\]|<br>\n/g, '');
      cleanText = cleanText.replace(/\\[!CAUTION\\]|<br>\n/g, '');

      return `<p>${cleanText}</p>`;
    };

    // Render markdown
    document.addEventListener('DOMContentLoaded', () => {
      const markdownData = document.getElementById('markdown-data').textContent;

      marked.use({ renderer });

      // Render markdown to HTML
      const html = DOMPurify.sanitize(marked.parse(markdownData), {
        ADD_ATTR: ['target'] // Allow target="_blank" on links if needed
      });

      document.getElementById('content').innerHTML = html;

      // Generate TOC automatically
      generateTOC();
    });

    function generateTOC() {
      const content = document.getElementById('content');
      const headings = content.querySelectorAll('h2, h3');
      const toc = document.getElementById('toc');

      headings.forEach(heading => {
        // Skip the "Daftar Isi" heading itself since we build a real one
        if (heading.textContent.toLowerCase() === 'daftar isi') return;

        // Ensure heading has an ID
        if (!heading.id) {
          heading.id = heading.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        }

        const link = document.createElement('a');
        link.href = '#' + heading.id;
        link.textContent = heading.textContent;
        // Add specific indenting for H3
        link.className = 'toc-link ' + (heading.tagName === 'H2' ? 'toc-h2' : 'toc-h3');

        // Add smooth scroll
        link.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById(heading.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.pushState(null, null, '#' + heading.id);
        });

        toc.appendChild(link);
      });
    }
  </script>
</body>

</html>
